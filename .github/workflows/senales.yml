name: Radar MEXC

on:
  schedule:
    - cron: "7 */3 * * *"   # respaldo: reanuda el análisis continuo si se detuvo
  workflow_dispatch:
    inputs:
      modo:
        description: "continuo = analizar sin parar · senales = una sola vez · prueba = mensaje de prueba · backtest = solo reporte"
        required: true
        default: continuo
        type: choice
        options: [continuo, senales, prueba, backtest]

permissions:
  contents: write
  actions: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RIESGO_POR_OPERACION_USD: ${{ vars.RIESGO_POR_OPERACION_USD }}
      APALANCAMIENTO: ${{ vars.APALANCAMIENTO }}
      NUM_PARES: ${{ vars.NUM_PARES }}
      MIN_T: ${{ vars.MIN_T }}
      HORA_RESUMEN: ${{ vars.HORA_RESUMEN }}
      MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
      MEXC_API_SECRET: ${{ secrets.MEXC_API_SECRET }}
      MODO: ${{ vars.MODO }}
      INTERVALO_MIN: ${{ vars.INTERVALO_MIN }}
      MODO_RUN: ${{ github.event.inputs.modo || 'continuo' }}
      MAX_POSICIONES: ${{ vars.MAX_POSICIONES }}
      LIMITE_PERDIDA_DIARIA: ${{ vars.LIMITE_PERDIDA_DIARIA }}
      LIMITE_PERDIDA_MENSUAL: ${{ vars.LIMITE_PERDIDA_MENSUAL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Análisis continuo (cada 5 minutos, ~5,6 horas)
        if: env.MODO_RUN == 'continuo'
        run: bash ciclo.sh

      - name: Relanzar el análisis continuo
        if: "!cancelled() && env.MODO_RUN == 'continuo'"
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run senales.yml --ref main -f modo=continuo

      - name: Analizar una vez
        if: env.MODO_RUN != 'continuo'
        run: python main.py ${{ env.MODO_RUN }}

      - name: Publicar datos en el panel
        if: always() && env.MODO_RUN != 'continuo'
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data 2>/dev/null || exit 0
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Actualizar datos del radar" -q
          for i in 1 2 3; do
            git pull --rebase -q -X theirs && git push -q && exit 0
            sleep 5
          done
          exit 1
